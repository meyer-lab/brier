[project]
name = "bootstraptools"
version = "0.1.0"
description = "Package for analyzing models using bootstrap resampling methods"
authors = [
    { name = "Ethan Hurt", email = "eshurt@g.ucla.edu" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "polars>=1.39.3",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
