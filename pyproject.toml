[project]
name = "bootstraptools"
version = "0.1.0"
description = "Package for analyzing models using bootstrap resampling methods"
authors = [
    { name = "Ethan Hurt", email = "eshurt@g.ucla.edu" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "polars>=1.39.3",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"
